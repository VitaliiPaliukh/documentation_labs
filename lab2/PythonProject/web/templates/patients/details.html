{% extends "base.html" %}
{% block title %}Patient {{ patient.id }}{% endblock %}
{% block content %}
<h1>Patient Details</h1>
<p><strong>ID:</strong> {{ patient.id }}</p>
<p><strong>Full Name:</strong> {{ patient.full_name }}</p>
<p><strong>Phone:</strong> {{ patient.phone }}</p>
<p><strong>Insurance Number:</strong> {{ patient.insurance_number }}</p>

<p>
    <a href="{{ url_for('patients.edit_patient', patient_id=patient.id) }}">Edit</a>
    <a href="{{ url_for('patients.list_patients') }}">Back to list</a>
</p>
{% endblock %}
